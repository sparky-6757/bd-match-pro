name: 📊 Data correctiondescription: Update buyer info, deal data, default parameters. · 、、。
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Help us keep the dataset fresh. Please cite a source.
        ，。
  - type: dropdown
    id: kind
    attributes:
      label: Type of data      options:
        - Buyer profile (portfolio / contacts / financials)
        - Comparable deal (transaction details)
        - Default parameter (PoS / WACC / peak / margin / ramp)
        - Indication / TA peak-sales benchmark
        - Other
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change      placeholder: "Pfizer's ADC focus increased after Seagen acquisition — modality weight should reflect this"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source      placeholder: "Pfizer Q4 2024 earnings call · https://..."
    validations:
      required: true
