name: 🐛 Bug report · Bug
description: Something is broken or producing wrong output. · 。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug — the more detail, the faster the fix.
         bug ，。
  - type: input
    id: summary
    attributes:
      label: Summary      placeholder: "Buyer match score for Pfizer is suspiciously low for ADC assets"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce      placeholder: |
        1. Go to https://sparky-6757.github.io/bd-match-pro/
        2. Set drug class = New, modality = ADC, indication = NSCLC, stage = Ph2
        3. Observe Pfizer ranks #15 instead of expected top-5
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual ·  vs.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser      placeholder: "Chrome 130 / Safari 17 / Firefox 128"
  - type: textarea
    id: extra
    attributes:
      label: Additional context
