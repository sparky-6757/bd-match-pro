name: 🧮 Methodology proposaldescription: Improve a formula, model, or scoring weight. · 、。
labels: ["methodology"]
body:
  - type: markdown
    attributes:
      value: |
        Methodology changes ripple through every output — please make a clear case.
        ，。
  - type: textarea
    id: current
    attributes:
      label: Current behaviour      placeholder: "rNPV uses a flat WACC of 11% across all stages"
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed change      placeholder: "Stage-conditional WACC: Preclinical 14%, Ph1 13%, Ph2 12%, Ph3 11%, NDA 10%, Approved 9%"
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale      placeholder: "Citations, papers, industry standard practice, internal analysis..."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Expected impact on outputs      placeholder: "Early-stage assets become ~12% lower NPV; late-stage essentially unchanged"
